name: Build macOS app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15        # Apple Silicon (M1–M4)
            arch: arm64
          - runner: macos-15-intel  # Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Physics check
        run: |
          python -m pip install -r requirements.txt
          QT_QPA_PLATFORM=offscreen python check_sim.py

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build Flake.app and DMG
        run: ./build.sh

      - name: Rename archive and checksum
        run: |
          cd dist
          mv Flake-macOS.zip "Flake-macOS-${{ matrix.arch }}.zip"
          mv Flake.dmg "Flake-macOS-${{ matrix.arch }}.dmg"
          for f in "Flake-macOS-${{ matrix.arch }}.zip" "Flake-macOS-${{ matrix.arch }}.dmg"; do
            shasum -a 256 "$f" > "$f.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Flake-macOS-${{ matrix.arch }}
          path: |
            dist/Flake-macOS-${{ matrix.arch }}.zip
            dist/Flake-macOS-${{ matrix.arch }}.dmg
            dist/Flake-macOS-${{ matrix.arch }}.*.sha256

  release:
    # Права на запись — только этой задаче и только для тегов v*.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Flake для macOS ${{ github.ref_name }}
          body: |
            Снег на рабочем столе Mac.

            - **Flake-macOS-arm64.dmg** — Apple Silicon (M1–M4)
            - **Flake-macOS-x86_64.dmg** — Intel
            - то же в zip — если DMG не нужен

            Откройте DMG и перетащите Flake в «Программы». Приложение не подписано
            сертификатом Apple: при первом запуске — правый клик → «Открыть».
            Если macOS пишет «повреждено»: `xattr -dr com.apple.quarantine /Applications/Flake.app`.

            Программа не обращается к интернету. Контрольные суммы — в файлах `.sha256`.
          files: dist/*
