name: Build macOS app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15        # Apple Silicon (M1–M4)
            arch: arm64
          - runner: macos-15-intel  # Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Physics check
        run: |
          python -m pip install -r requirements.txt
          QT_QPA_PLATFORM=offscreen python check_sim.py

      - name: Build Flake.app
        run: ./build.sh

      - name: Rename archive
        run: mv dist/Flake-macOS.zip "dist/Flake-macOS-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Flake-macOS-${{ matrix.arch }}
          path: dist/Flake-macOS-${{ matrix.arch }}.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Flake-macOS-${{ matrix.arch }}.zip
